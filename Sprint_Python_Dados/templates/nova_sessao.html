<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Nova Sessão</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Nova sessão de recarga</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>ID:</label>
            <input type="number" name="id">

            <label>Energia kWh:</label>
            <input type="number" name="energia" step="0.01">

            <label>Tempo min:</label>
            <input type="number" name="tempo">

            <label>Custo R$:</label>
            <input type="number" name="custo" step="0.01">

            <button type="submit">Cadastrar sessão</button>

        </form>
        
        <a href="/">
            <button>Voltar ao menu</button>
        </a>

    </div>

</body>

</html>
