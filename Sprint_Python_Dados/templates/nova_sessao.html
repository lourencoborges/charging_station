<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar sessão</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Cadastrar sessão</h1>
        <p>Cadastro manual do ADM. A sessão é incluída imediatamente, sem tempo de espera.</p>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
        {% endwith %}
        <form method="POST">
            <label for="placa">Placa do veículo</label>
            <input id="placa" name="placa" minlength="7" maxlength="7" pattern="[A-Za-z0-9]{7}" title="Use 7 letras ou números." required>
            <label for="energia">Energia consumida (kWh)</label>
            <input id="energia" name="energia" type="number" min="0.01" step="0.01" required>
            <label for="tempo">Tempo de recarga (minutos)</label>
            <input id="tempo" name="tempo" type="number" min="1" step="1" required>
            <button type="submit">Adicionar à lista</button>
            <button type="submit" name="acao" value="aleatoria" formnovalidate>Fazer sessão aleatória</button>
        </form>
        <a href="{{ url_for('area_admin') }}"><button type="button">Voltar à área do ADM</button></a>
    </main>
</body>
</html>
