<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Listar Sessões</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Lista de sessões</h1>

        {% for sessao in sessoes %}

        <div class="sessao">

            <p>ID: {{ sessao.id }}</p>
            <p>Energia: {{ sessao.energia }}</p>
            <p>Tempo: {{ sessao.tempo }}</p>
            <p>Custo: {{ sessao.custo }}</p>

        </div>

        {% endfor %}

        <a href="/">
            <button>Voltar ao menu</button>
        </a>

    </div>

</body>

</html>
